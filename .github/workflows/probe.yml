name: Revisión (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: python
        run: |
          import json, urllib.request, time
          get=lambda u: urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=30).read().decode()
          d=json.loads(get(f"https://codicilio.github.io/madrid-basket/data.json?x={int(time.time())}"))
          print("UPD", d["updatedAt"])
          for g in d["games"]:
              if g["date"] in ("2026-11-04","2026-11-08"): print("GAME", {k:g.get(k) for k in ("date","home","away","played","status","score","channels")})
          nxt=[g for g in d["games"] if not g["played"]][0]; print("NEXT", nxt["date"], nxt["home"], nxt["away"])
