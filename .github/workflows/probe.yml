name: Revisión directo (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Datos y fuente oficial
        shell: python
        run: |
          import json, urllib.request, time
          get=lambda u: urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=40).read().decode()
          d=json.loads(get(f"https://codicilio.github.io/madrid-basket/data.json?x={int(time.time())}"))
          print("UPD", d["updatedAt"])
          for g in d["games"]:
              if g["date"]=="2026-11-08": print("WEBDATA", {k:g.get(k) for k in ("home","away","played","live","score","periodLabel","liveMatchId","kickoffUtc")})
          c=json.loads(get("https://api2.acb.com/api/seasondata/Calendar/season-calendar?season=2027&competitionId=1"))
          mad=[t["id"] for t in c["teams"] if t.get("clubId")==9][0]
          for r in c["rounds"]:
              for m in r["matches"]:
                  if r["roundNumber"]==7 and mad in (m["homeTeamId"],m["awayTeamId"]):
                      print("ACB", {k:m.get(k) for k in ("id","matchStatus","homeScore","awayScore","currentQuarter","isOnHalfTime","startDateTime")})
          h=get(f"https://codicilio.github.io/madrid-basket/?x={int(time.time())}")
          print("INDEX pollLive:", "pollLive" in h)
      - name: Navegador real
        run: |
          npm i --no-save playwright@1.47.2 >/dev/null 2>&1
          cat > b.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({channel:'chrome'});const p=await b.newPage({viewport:{width:390,height:844}});
          const errs=[];p.on('pageerror',e=>errs.push('PAGEERR '+e.message));p.on('console',m=>{if(m.type()==='error')errs.push('CONSOLE '+m.text())});
          await p.goto('https://codicilio.github.io/madrid-basket/?x='+Date.now());await p.waitForTimeout(40000);
          console.log('HERO', (await p.$eval('#hero',e=>e.innerText)).replace(/\s+/g,' '));
          console.log('SYNC', await p.$eval('#syncTxt',e=>e.innerText));
          console.log('ERRS', JSON.stringify(errs));await b.close()})();
          JS
          node b.js
