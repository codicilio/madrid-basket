name: Revisión final (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: python
        run: |
          import json, urllib.request, time
          get=lambda u: urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=40).read().decode()
          d=json.loads(get(f"https://codicilio.github.io/madrid-basket/data.json?x={int(time.time())}"))
          print("UPD", d["updatedAt"])
          for g in d["games"]:
              if g["date"]=="2026-11-08": print("WEBDATA", {k:g.get(k) for k in ("home","away","played","live","status","score","boxscoreUrl")})
          nx=[g for g in d["games"] if not g["played"]][:2]
          for g in nx: print("NEXT", {k:g.get(k) for k in ("date","time","competition","home","away","channels","tv")})
          for c in ("acb","euro"): print("STAND", c, [r for r in d["standings"][c] if r["team"]=="RMA"])
          c=json.loads(get("https://api2.acb.com/api/seasondata/Calendar/season-calendar?season=2027&competitionId=1"))
          mad=[t["id"] for t in c["teams"] if t.get("clubId")==9][0]
          for r in c["rounds"]:
              for m in r["matches"]:
                  if r["roundNumber"]==7 and mad in (m["homeTeamId"],m["awayTeamId"]):
                      print("ACB", {k:m.get(k) for k in ("matchStatus","homeScore","awayScore")})
