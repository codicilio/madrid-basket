name: Prueba fuentes TV (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probar guías de TV
        shell: python
        run: |
          import gzip, re, json, urllib.request
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"}
          def get(u):
              r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=60)
              b = r.read()
              if b[:2] == b"\x1f\x8b": b = gzip.decompress(b)
              return r.status, b.decode("utf-8", "replace")
          urls = [
            "https://www.movistarplus.es/programacion-tv/2026-11-04?v=json",
            "https://www.movistarplus.es/programacion-tv/2026-11-08?v=json",
            "https://www.movistarplus.es/deportes/baloncesto/horarios",
            "https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml",
            "https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml.gz",
          ]
          for u in urls:
              print("\n=====", u)
              try:
                  st, t = get(u)
              except Exception as e:
                  print("ERROR", e); continue
              print("status", st, "len", len(t), "head:", t[:300].replace("\n"," "))
              for kw in ("Panathinaikos", "UCAM Murcia", "Murcia"):
                  for m in list(re.finditer(kw, t))[:4]:
                      print("--", kw, ":", t[max(0,m.start()-500):m.end()+300].replace("\n"," "))
              if "<tv" in t[:500]:
                  chans = dict(re.findall(r'<channel id="([^"]+)">\s*<display-name[^>]*>([^<]+)', t))
                  print("canales con 'aloncesto|Vamos|DAZN|M+':", {k:v for k,v in chans.items() if re.search(r"aloncesto|Vamos|DAZN|M\+|Movistar", v)})
                  for p in re.finditer(r'<programme start="([^"]+)"[^>]*channel="([^"]+)"[^>]*>\s*<title[^>]*>([^<]+)', t):
                      if re.search(r"Madrid", p.group(3)) and re.search(r"Panathinaikos|Murcia|Baloncesto|Euroliga|Liga Endesa", p.group(3)+t[p.end():p.end()+300]):
                          print("PROG", p.group(1), chans.get(p.group(2), p.group(2)), "|", p.group(3))
