name: Revisión (temporal)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: python
        run: |
          import json, urllib.request, time
          get=lambda u: urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"Mozilla/5.0"}), timeout=30).read().decode()
          import re
          t=get("https://dbasket.net/teams/RMA/2026-27/euro")
          m=re.search(r'partido-a-partido.*?</table>', t, re.S)
          blk=m.group(0) if m else "NO BLOCK"
          for r in re.findall(r'<tr.*?</tr>', blk, re.S):
              if '04-11-2026' in r or '30-10-2026' in r: print("ROW", re.sub(r"\s+"," ",r)[:1500])
          L=get("https://dbasket.net/seasons/euro/2026-27")
          k=L.find("RMA"); print("STAND", re.sub(r"\s+"," ",L[k-300:k+400]))
